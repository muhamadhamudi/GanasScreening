{% extends 'admin/_layout.html' %}{% block content %}<h1 class="text-3xl font-black">Manajemen Mentor</h1><div class="panel p-5 mt-6"><h2 class="font-bold">Tambah Mentor</h2><form method="post" class="grid md:grid-cols-4 gap-3 mt-4"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="username" class="field" placeholder="Username" required><input name="display_name" class="field" placeholder="Nama mentor" required><input name="password" type="password" minlength="10" class="field" placeholder="Password awal (min. 10)" required><button class="btn-primary">Tambah Mentor</button></form></div><div class="space-y-4 mt-6">{% for m in mentors %}<div class="panel p-5"><div class="flex flex-wrap justify-between gap-3"><div><h3 class="font-bold text-lg">{{m.display_name}}</h3><p class="text-slate-400 text-sm">@{{m.username}} · {{m.participants|length}} peserta</p><span class="status {{'lolos' if m.is_active else 'tidak-lolos'}}">{{'Aktif' if m.is_active else 'Nonaktif'}}</span></div><div class="flex flex-wrap gap-2"><a class="btn-secondary" href="{{url_for('admin.mentor_qr',user_id=m.id)}}" download="screenflow-{{m.username}}-qr.png">Download QR</a><form method="post" action="{{url_for('admin.reset_qr',user_id=m.id)}}" onsubmit="return confirm('Reset QR? QR lama tidak dapat digunakan lagi.')"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn-secondary">Reset QR</button></form><form method="post" action="{{url_for('admin.toggle_mentor',user_id=m.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn-secondary">{{'Nonaktifkan' if m.is_active else 'Aktifkan'}}</button></form></div></div><div class="mt-4"><img class="w-32 h-32 bg-white p-2 rounded-xl" src="{{url_for('admin.mentor_qr',user_id=m.id)}}" alt="QR {{m.display_name}}"></div><form method="post" action="{{url_for('admin.update_mentor',user_id=m.id)}}" class="grid md:grid-cols-4 gap-3 mt-5"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="display_name" class="field" value="{{m.display_name}}" required><input name="username" class="field" value="{{m.username}}" required><input name="password" type="password" minlength="10" class="field" placeholder="Password baru (opsional)"><button class="btn-primary">Simpan Perubahan</button></form></div>{% endfor %}</div>{% endblock %}
