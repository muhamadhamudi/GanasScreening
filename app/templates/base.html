<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{% block title %}SCREENFLOW{% endblock %}</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#020617',navy:'#0F172A',cyanx:'#22D3EE'}}}}</script><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head><body class="bg-slate-950 text-slate-100 min-h-screen">{% block body %}{% endblock %}<div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="toast rounded-xl px-4 py-3 shadow-xl border {{ 'border-rose-500/40 bg-rose-950' if category=='error' else 'border-cyan-500/40 bg-slate-800' }}">{{ message }}</div>{% endfor %}{% endwith %}</div><script src="{{ url_for('static',filename='js/app.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
